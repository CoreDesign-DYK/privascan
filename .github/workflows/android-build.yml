name: Android Build

on:
  workflow_dispatch:          # 수동 실행 버튼
  push:
    branches: [main]
    paths:
      - 'artifacts/web-scanner/**'
      - '.github/workflows/android-build.yml'

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Debug APK  (빠른 확인용, 서명 불필요)
  # ────────────────────────────────────────────────────────────
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/web-scanner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requires Node >=22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 8 Android plugin requires Java 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app for Android
        run: pnpm build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: artifacts/web-scanner/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivaScan-debug-${{ github.run_number }}
          path: artifacts/web-scanner/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Job 2: Live Reload APK (Replit development server)
  #   Repository variable: PRIVASCAN_LIVE_RELOAD_URL
  # ────────────────────────────────────────────────────────────
  live_reload:
    name: Live Reload APK
    runs-on: ubuntu-latest
    if: ${{ vars.PRIVASCAN_LIVE_RELOAD_URL != '' }}
    defaults:
      run:
        working-directory: artifacts/web-scanner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build:android

      - name: Sync Capacitor with Replit Live Reload
        env:
          CAPACITOR_LIVE_RELOAD_URL: ${{ vars.PRIVASCAN_LIVE_RELOAD_URL }}
        run: node scripts/capacitor-live-sync.mjs android

      - name: Build Live Reload APK
        working-directory: artifacts/web-scanner/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Live Reload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivaScan-live-${{ github.run_number }}
          path: artifacts/web-scanner/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Job 3: Release AAB  (Play Store 업로드용, 서명 포함)
  #   필요한 GitHub Secrets:
  #     KEYSTORE_BASE64   — base64로 인코딩된 .p12 키스토어
  #     KEYSTORE_PASSWORD — 키스토어 + 키 비밀번호
  #     KEYSTORE_ALIAS    — 키 별칭 (privascan)
  # ────────────────────────────────────────────────────────────
  release:
    name: Release AAB (Play Store)
    runs-on: ubuntu-latest
    # KEYSTORE_BASE64 secret 이 등록된 경우에만 실행
    if: ${{ vars.RELEASE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: artifacts/web-scanner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requires Node >=22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 8 Android plugin requires Java 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app for Android
        run: pnpm build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > /tmp/privascan-release.p12
          echo "Keystore decoded: $(wc -c < /tmp/privascan-release.p12) bytes"

      - name: Build Release AAB
        working-directory: artifacts/web-scanner/android
        env:
          KEYSTORE_FILE: /tmp/privascan-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PrivaScan-release-aab-${{ github.run_number }}
          path: artifacts/web-scanner/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
